[project]
name = "clifford-vae"
version = "0.2.0"
description = "vaes with a clifford torus prior: hrr-compatible latent codes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "torchmetrics[image]>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "h5py>=3.9",
    "wandb>=0.15",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["clifford_vae", "clifford_vae.vmf"]

# uv: cuda wheels on linux, the default (cpu / mps) wheels elsewhere
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
